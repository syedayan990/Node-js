<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Home</title>

  <link rel="stylesheet" href="/output.css">
</head>

<body class="bg-gray-100">

<nav class="bg-red-500 text-white shadow-md">
    <div class="max-w-6xl mx-auto flex gap-8 px-6 py-3">
      <a href="/">Go to Home</a>
      <a href="/host/add-home">Add Home</a>
    </div>
</nav>

<div class="flex justify-center mt-12">

<div class="bg-white p-8 rounded-lg shadow-lg w-[500px]">

<h1 class="text-3xl font-bold mb-6 text-center">
Register your House
</h1>

<form action="/host/add-home" method="POST" class="space-y-5">

<input
type="text"
name="houseName"
placeholder="Enter House Name"
class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-400"
/>

<button
class="bg-red-500 text-white w-full py-3 rounded-lg hover:bg-red-600">

Add Home

</button>

</form>

</div>

</div>

</body>
</html>
